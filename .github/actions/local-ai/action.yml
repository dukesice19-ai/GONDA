name: Private local AI
description: Runs an AI model inside this GitHub runner (Ollama). No outside AI service sees your data.
runs:
  using: composite
  steps:
    - name: Cache model
      uses: actions/cache@v4
      with:
        path: ~/.ollama/models
        key: ollama-${{ env.AGENT_MODEL || 'qwen2.5:3b' }}
    - name: Start private AI model
      shell: bash
      run: |
        curl -fsSL https://ollama.com/install.sh | sh >/dev/null 2>&1
        (OLLAMA_NUM_PARALLEL=1 ollama serve >/tmp/ollama.log 2>&1 &)
        for i in $(seq 1 30); do curl -s localhost:11434 >/dev/null && break; sleep 1; done
        ollama pull "${AGENT_MODEL:-qwen2.5:3b}" >/dev/null
        echo "Private model ready: ${AGENT_MODEL:-qwen2.5:3b}"
